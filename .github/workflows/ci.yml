name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate ./plugins/wp-to-code --strict

      - name: Install script dependencies
        working-directory: plugins/wp-to-code/scripts
        run: npm install --no-audit --no-fund

      # ubuntu-latest ships Google Chrome, which is what playwright-core drives.
      - name: Diff gate self-check
        working-directory: plugins/wp-to-code/scripts
        run: node selfcheck.mjs
